[package]
name = "strictix-cli"
description = "strictix command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "strictix"
path = "src/main.rs"

[dependencies]
strictix-core = { path = "../core" }
strictix-syntax = { path = "../syntax" }
strictix-lints = { path = "../lints" }
strictix-import = { path = "../import" }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }
