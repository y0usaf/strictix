[package]
name = "strictix-cli"
description = "strictix command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "strictix"
path = "src/main.rs"

[dependencies]
strictix-core = { path = "../core" }
strictix-lints = { path = "../lints" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
