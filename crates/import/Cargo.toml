[package]
name = "strictix-import"
description = "Source-to-Nix-AST importers for strictix, built on tree-sitter grammars"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-commonlisp = "0.4"
tree-sitter-diff = "0.1.0"
tree-sitter-glsl = "0.2"
tree-sitter-javascript = "0.25"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2"
tree-sitter-md = { version = "0.5", default-features = false }
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-vbscript = { git = "https://github.com/jcolozzi/tree-sitter-VB6-VBA-VBS", rev = "b4e287e8162bc552802456a31f358a546d6531bd" }
